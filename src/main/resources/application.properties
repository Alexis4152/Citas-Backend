# ── DataSource ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_citas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────
# El esquema se gestiona con los scripts en /db (01_schema.sql, 02_seed.sql).
# validate evita que Hibernate altere la estructura ya definida por esos scripts.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Server ──────────────────────────────────────────────────────
server.port=${SERVER_PORT:8082}
server.servlet.context-path=/
spring.jackson.time-zone=America/Mexico_City
# Detrás de un proxy reverso (Coolify/Traefik en producción) resuelve el IP real del cliente
# desde X-Forwarded-For en vez del IP del proxy -- necesario para que el rate limiting por IP
# (RateLimitInterceptor) no trate a todos los clientes como uno solo.
server.forward-headers-strategy=native
# Dónde se cuentan las peticiones para el rate limiting: memory (una instancia) o database
# (varias instancias detrás de un balanceador: comparten los contadores en Postgres).
app.rate-limit.store=${APP_RATE_LIMIT_STORE:memory}

# ── CORS ────────────────────────────────────────────────────────
# Origenes del frontend permitidos a consumir la API (separados por coma, sin slash final).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:3000}

# ── Archivos subidos (fotos de doctores, logo del hospital) ──────
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
# URL publica del backend, usada para convertir las rutas relativas de /uploads/** que se
# guardan en BD en URLs absolutas en las respuestas de la API.
app.public-url=${APP_PUBLIC_URL:}
# Limite GLOBAL de multipart con margen sobre el limite real de negocio (2MB por foto/logo,
# ver FileStorageServiceImpl): asi el mensaje de error legible lo da el service, no un 413
# crudo de Tomcat (patron 08).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── URL publica del frontend (links en correos: reset de contrasena, QR de comprobante) ──
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5175}

# ── JWT ─────────────────────────────────────────────────────────
# En produccion SIEMPRE sobreescribir APP_JWT_SECRET con una variable de entorno propia.
app.jwt.secret=${APP_JWT_SECRET:hospital-citas-dev-secret-key-change-in-production-2026}
# Corto a proposito (patron 01): autoriza cada request, se renueva solo via /api/auth/refresh
# usando el refresh token de la cookie httpOnly, sin pedir credenciales de nuevo.
app.jwt.expiration=${APP_JWT_EXPIRATION:1800000}

# ── Refresh token opaco (patron 01) ──────────────────────────────
# Vive en una cookie httpOnly (ver AuthController), revocable individualmente (logout) o en
# bloque (cambio de contrasena, reset). 8h ~ un turno de trabajo del personal.
app.refresh.expiration=${APP_REFRESH_EXPIRATION:28800000}
# En produccion con frontend y backend en dominios distintos, cambiar a true (requiere HTTPS)
# para que la cookie viaje con SameSite=None entre origenes.
app.cookie.secure=${APP_COOKIE_SECURE:false}

# ── Cifrado de credenciales guardadas (llave privada de OpenPay, contraseña SMTP) ──
# AES-256-GCM. Genera una propia: openssl rand -base64 48. Si se cambia, las credenciales ya
# guardadas dejan de leerse y hay que volver a capturarlas en el panel.
app.encryption.key=${APP_ENCRYPTION_KEY:}
# true = no arranca en producción (frontend https) si la configuración de seguridad es insegura.
app.security.strict=${APP_SECURITY_STRICT:false}

# ── Jackson ─────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Correo (confirmaciones/cancelaciones de citas) ────────────────
# La configuracion SMTP (host, puerto, usuario, contrasena, habilitado) vive en la tabla
# email_config, no aqui: se administra desde /api/admin/email-config (ver EmailServiceImpl,
# que arma el cliente SMTP en cada envio a partir de esa tabla). Por default queda
# deshabilitada hasta que el ADMIN capture credenciales reales desde el panel.

# Reglas de citas (ver AppointmentServiceImpl)
# Tope de citas programadas vigentes por paciente, y por teléfono en el agendado de invitado.
app.appointments.max-active-per-patient=${APP_MAX_ACTIVE_PER_PATIENT:5}
app.appointments.max-active-per-phone=${APP_MAX_ACTIVE_PER_PHONE:10}
# Horas mínimas de anticipación para que el propio paciente reprograme (dentro de ese plazo,
# debe llamar al hospital).
app.appointments.self-reschedule-min-hours=${APP_SELF_RESCHEDULE_MIN_HOURS:24}
# Apartado temporal del horario mientras alguien termina de agendar (ver SlotHoldService):
# minutos que dura, tope total aunque se renueve, y apartados simultáneos por conexión (IP).
app.appointments.slot-hold-minutes=${APP_SLOT_HOLD_MINUTES:10}
app.appointments.slot-hold-max-minutes=${APP_SLOT_HOLD_MAX_MINUTES:20}
app.appointments.slot-hold-max-per-ip=${APP_SLOT_HOLD_MAX_PER_IP:3}
# Al cancelar una cita futura, el espacio vuelve a estar disponible de inmediato.
app.appointments.auto-release-on-cancel=${APP_AUTO_RELEASE_ON_CANCEL:true}

# Pasarela de pagos OpenPay (pago anticipado con tarjeta/SPEI y cobro con tarjeta en recepción).
# Por defecto: SANDBOX. La private key y el password del webhook NO tienen default: defínelos
# siempre con variables de entorno (ver .env.example). En producción sobreescribe TODAS con variables de
# entorno y pon OPENPAY_PRODUCTION=true y OPENPAY_BASE_URL=https://api.openpay.mx/v1
openpay.merchant-id=${OPENPAY_MERCHANT_ID:mnkt5l2z2or5x3r0v0uf}
openpay.private-key=${OPENPAY_PRIVATE_KEY:}
openpay.public-key=${OPENPAY_PUBLIC_KEY:pk_dd6766e3510a45a58dbd5e20af39e247}
openpay.base-url=${OPENPAY_BASE_URL:https://sandbox-api.openpay.mx/v1}
openpay.production=${OPENPAY_PRODUCTION:false}
openpay.timeout-seconds=${OPENPAY_TIMEOUT_SECONDS:15}
# Credenciales que OpenPay debe enviar (Basic) al webhook /api/webhooks/openpay
openpay.webhook-user=${OPENPAY_WEBHOOK_USER:openpay_webhook}
openpay.webhook-password=${OPENPAY_WEBHOOK_PASSWORD:}
