# Perfil de pruebas: H2 en memoria en modo PostgreSQL, esquema generado por Hibernate a
# partir de las entidades (a diferencia de dev/prod, que usan los scripts de /db).
spring.datasource.url=jdbc:h2:mem:hospital_citas_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
# Corre data.sql DESPUES de que Hibernate cree el esquema (ddl-auto=create-drop), no antes.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=embedded

app.cors.allowed-origins=http://localhost:5175
app.uploads.dir=target/test-uploads
app.jwt.secret=test-secret-key-not-for-production-use-only-in-automated-tests
app.jwt.expiration=3600000

# Credenciales del webhook de OpenPay solo para tests (en runtime no tienen default)
openpay.webhook-password=test_webhook_password
